name: ssh-jump

# 用途：GitHub 的 runner 在境外，可以直连被大陆封锁的 176.122.164.30。
# 在本页点 "Run workflow"，填一条命令即可在那台服务器上执行。

on:
  workflow_dispatch:
    inputs:
      target:
        description: "user@host"
        required: true
        default: "root@176.122.164.30"
      port:
        description: "SSH 端口"
        required: true
        default: "22"
      command:
        description: "要在服务器上执行的命令"
        required: true
        default: "whoami; hostname; uptime; ss -lntp | head -20"

permissions:
  contents: read

jobs:
  ssh:
    # 只允许仓库所有者触发，避免他人借这条通道操作服务器
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET: ${{ inputs.target }}
      PORT: ${{ inputs.port }}
      REMOTE_CMD: ${{ inputs.command }}
    steps:
      - name: 准备 SSH 凭据
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if [ -n "${SSH_KEY:-}" ]; then
            printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            echo "已安装私钥"
          fi
          if [ -n "${SSH_PASSWORD:-}" ]; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass
            echo "已安装 sshpass（密码登录）"
          fi
          HOST="${TARGET#*@}"
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "目标：$TARGET  端口：$PORT"

      - name: 执行远程命令
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -uo pipefail
          OPTS="-o ConnectTimeout=20 -o ServerAliveInterval=15 -o StrictHostKeyChecking=accept-new"
          if [ -n "${SSH_PASSWORD:-}" ]; then
            sshpass -p "$SSH_PASSWORD" ssh $OPTS -o PreferredAuthentications=password,publickey -p "$PORT" "$TARGET" "$REMOTE_CMD"
          else
            ssh $OPTS -o BatchMode=yes -o PreferredAuthentications=publickey -p "$PORT" "$TARGET" "$REMOTE_CMD"
          fi
