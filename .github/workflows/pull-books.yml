name: pull-books

# 用途：把服务器上的书籍打包，经 GitHub Release 中转回本地（服务器 IP 被墙，直连不可用）
on:
  workflow_dispatch:
    inputs:
      dirs:
        description: "要打包的书目录（空格分隔，位于 /var/www/reader/books 下）"
        required: true
        default: "xing-basic-organic-4-upper xing-basic-organic-4-lower xing-basic-organic-4-solutions clayden-chinese inorganic-chemistry-zhang-zude feynman-lectures santi-1 santi-2 shanyangrenlei zhongguo2185 chaoxinxingjiyuan hongloumeng"
      tag:
        description: "Release 标签（用完要删）"
        required: true
        default: "books-tmp"

permissions:
  contents: write

jobs:
  pull:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TARGET: root@176.122.164.30
      DIRS: ${{ inputs.dirs }}
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 准备 SSH 凭据
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${TARGET#*@}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: 服务器端打包
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$TARGET" bash -s <<EOF
          set -e
          cd /var/www/reader/books
          for d in $DIRS; do
            [ -d "\$d" ] || { echo "skip \$d"; continue; }
            tar -cf /tmp/bk_\$d.tar "\$d"
            echo "packed \$d"
          done
          df -h /tmp | tail -1
          ls -lh /tmp/bk_*.tar
          EOF

      - name: 拉取到 runner
        run: |
          set -euo pipefail
          mkdir -p out && cd out
          for d in $DIRS; do
            scp -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$TARGET:/tmp/bk_$d.tar" . || echo "scp failed: $d"
          done
          ls -lh

      - name: 上传为 Release 资产
        run: |
          set -euo pipefail
          cd out
          R="$GITHUB_REPOSITORY"
          gh release view "$TAG" -R "$R" >/dev/null 2>&1 || gh release create "$TAG" -R "$R" --title "tmp transfer" --notes "temporary book transfer, will be deleted"
          gh release upload "$TAG" -R "$R" ./*.tar --clobber
          gh release view "$TAG" -R "$R" --json assets -q '.assets[] | "\(.name)\t\(.size)"'

      - name: 清理服务器临时文件
        if: always()
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$TARGET" 'rm -f /tmp/bk_*.tar; echo cleaned' || true
